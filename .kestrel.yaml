version: "1.0"
name: "kestrel-self-host"

env:
  GO111MODULE: "on"
  CGO_ENABLED: "0"

jobs:
  lint:
    name: "Code Linting"
    runs-on: "host"
    commands:
      - "go vet ./..."

  test:
    name: "Unit & E2E Tests"
    needs: [lint]
    runs-on: "host"
    commands:
      - "go test -v ./pkg/... ./test/..."

  build:
    name: "Compile Binary & SBOM"
    needs: [test]
    runs-on: "host"
    commands:
      - "go build -ldflags=\"-s -w\" -o bin/kestrel.exe ./cmd/kestrel"
      - "bin/kestrel.exe sbom --out .kestrel/sbom.json"
    artifacts:
      paths:
        - "bin/kestrel.exe"
        - ".kestrel/sbom.json"
